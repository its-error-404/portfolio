<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for the social share card. Export to og-image.png (1200x630). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0E" />
      <stop offset="1" stop-color="#08080A" />
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#6E7BFF" stop-opacity="0.16" />
      <stop offset="1" stop-color="#6E7BFF" stop-opacity="0" />
