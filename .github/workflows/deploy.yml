name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can read the last content-commit date
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Derive "Last updated" from the newest commit touching src/data
        run: |
          D=$(git log -1 --format=%cs -- src/data/)
          echo "VITE_CONTENT_UPDATED=${D:-$(date +%Y-%m-%d)}" >> "$GITHUB_ENV"
          echo "Last updated -> ${D:-$(date +%Y-%m-%d)}"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
