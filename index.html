<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFBFC" media="(prefers-color-scheme: light)" />

    <!-- PRIMARY META ------------------------------------------------------- -->
    <title>Karthikeyan A — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer with 3+ years building production React &amp; TypeScript apps for healthcare and workforce SaaS. Real-time UI, Stripe payments, shared component libraries. Node / Express / Postgres on side projects. AWS certified. Open to frontend or full-stack."
    />
    <meta name="author" content="Karthikeyan A" />
    <meta
      name="keywords"
      content="Karthikeyan A, Software Engineer, Frontend Engineer, Full-Stack Engineer, React, TypeScript, Node.js, PostgreSQL, Chennai"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://karthikeyan.dev/" />

    <!-- OPEN GRAPH -------------------------------------------------------- -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Karthikeyan A" />
    <meta property="og:title" content="Karthikeyan A — Software Engineer" />
    <meta
      property="og:description"
      content="I build and ship production web apps. React &amp; TypeScript front ends, Node / Express / Postgres on side projects. Open to frontend or full-stack."
    />
    <meta property="og:url" content="https://karthikeyan.dev/" />
    <meta property="og:image" content="https://karthikeyan.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Karthikeyan A — Software Engineer" />

    <!-- TWITTER / X ----------------------------------------------------- -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Karthikeyan A — Software Engineer" />
    <meta
      name="twitter:description"
      content="I build and ship production web apps. React &amp; TypeScript front ends, Node / Express / Postgres on side projects. Open to frontend or full-stack."
    />
    <meta name="twitter:image" content="https://karthikeyan.dev/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- FONTS: preconnect + non-render-blocking load (swap to fallback first) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <!-- STRUCTURED DATA: Person --------------------------------------- -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Karthikeyan A",
        "url": "https://karthikeyan.dev/",
        "jobTitle": "Software Engineer",
        "address": { "@type": "PostalPlace", "addressLocality": "Chennai", "addressCountry": "IN" },
        "knowsAbout": [
          "React",
          "TypeScript",
          "Node.js",
          "Express",
          "PostgreSQL",
          "Web Performance",
          "Frontend Architecture",
          "Real-time web apps",
          "Full-stack development"
        ],
        "hasCredential": [
          "AWS Certified Solutions Architect – Associate",
          "AWS Certified AI Practitioner"
        ],
        "sameAs": [
          "https://github.com/its-error-404",
          "https://www.linkedin.com/in/karthikeyan-a-dev/"
        ]
      }
    </script>

    <!-- Set theme before paint to avoid flash -------------------------- -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          document.documentElement.setAttribute("data-theme", stored || "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
